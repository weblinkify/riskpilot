# RiskPilot
#   docker compose --profile real up --build   → postgres + backend + frontend (real API)  http://localhost:4200
#   docker compose --profile mock up --build   → frontend only, in-browser mock API        http://localhost:4200
name: riskpilot

services:
  postgres:
    profiles: [real]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riskpilot}
      POSTGRES_USER: ${POSTGRES_USER:-riskpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskpilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: [real]
    build: ./backend
    image: riskpilot-backend:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-riskpilot}
      DATABASE_USER: ${POSTGRES_USER:-riskpilot}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-riskpilot}
      ASSESSMENT_PROVIDER: ${ASSESSMENT_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6

  frontend-real:
    profiles: [real]
    build: ./frontend
    image: riskpilot-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_MODE: real
      BACKEND_URL: http://backend:8080
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz && wget -qO- http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend-mock:
    profiles: [mock]
    build: ./frontend
    image: riskpilot-frontend:local
    environment:
      API_MODE: mock
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
